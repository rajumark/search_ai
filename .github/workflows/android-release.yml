name: Android Release Build

on:
  push:
    branches:
      - main
      - release/*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease -PVERSION_NAME=${{ steps.date.outputs.date }}

      - name: Rename APK with version
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          NEW_NAME="search_ai-${{ steps.date.outputs.date }}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/release/$NEW_NAME"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.date.outputs.date }}
          path: app/build/outputs/apk/release/*.apk
