name: Android Debug Build

on:
  push:
    branches:
      - main
      - release/*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PVERSION_NAME=${{ steps.date.outputs.date }}

      - name: Rename Debug APK
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          NEW_NAME="search_ai-debug-${{ steps.date.outputs.date }}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/debug/$NEW_NAME"

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ steps.date.outputs.date }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release (Debug)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ steps.date.outputs.date }}
          name: Debug ${{ steps.date.outputs.date }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
