# PhotoSearchAI - Simple Android Release Pipeline
# Trigger: Runs when commit message contains "#go"
# Output: Release APK (optimized, debug-signed) uploaded to GitHub Releases

name: Android Release Build

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-and-release:
    name: 🚀 Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 🔍 Check for #go trigger
        id: check
        run: |
          if echo "${{ github.event.head_commit.message }}" | grep -q "#go"; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ No #go trigger - skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Checkout
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: 📅 Generate Version
        if: steps.check.outputs.should_build == 'true'
        id: version
        run: |
          echo "version_code=$(date -u +'%y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "version_name=$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: ☕ Setup JDK
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        if: steps.check.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: 🏗️ Build Release APK
        if: steps.check.outputs.should_build == 'true'
        env:
          CI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: 📦 Rename APK
        if: steps.check.outputs.should_build == 'true'
        id: rename
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW_NAME="PhotoSearchAI-${{ steps.version.outputs.version_name }}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/release/$NEW_NAME"
          echo "apk_path=app/build/outputs/apk/release/$NEW_NAME" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "Release ${{ steps.version.outputs.version_name }}"
          body: |
            ## 📱 PhotoSearchAI v${{ steps.version.outputs.version_name }}
            **Build:** ${{ steps.version.outputs.version_code }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
